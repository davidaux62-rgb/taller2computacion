<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ejercicio 1 · Registro de usuario</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="form-page">
    <section class="form-section">
      <div class="form-container">
        <header class="form-header">
          <span class="eyebrow">REGISTRO</span>
          <h1>Crear una cuenta</h1>
          <p>Complete sus datos para registrarse. Los campos con <strong>*</strong> son obligatorios.</p>
        </header>

        <form class="contact-form" action="#" method="post" novalidate>
          <div class="form-grid">
            <div class="form-field">
              <label for="nombre">
                Nombre completo
                <span class="required-mark" aria-hidden="true">*</span>
              </label>
              <input type="text" id="nombre" name="nombre" autocomplete="name" placeholder="Ana Torres" required>
            </div>
            <div class="form-field">
              <label for="correo">
                Correo electrónico
                <span class="required-mark" aria-hidden="true">*</span>
              </label>
              <input type="email" id="correo" name="correo" autocomplete="email" placeholder="ana@correo.com" required>
            </div>
          </div>

          <div class="form-grid">
            <div class="form-field">
              <label for="password">
                Contraseña
                <span class="required-mark" aria-hidden="true">*</span>
              </label>
              <input
                type="password"
                id="password"
                name="password"
                minlength="8"
                autocomplete="new-password"
                aria-describedby="password-help"
                required
              >
              <small id="password-help" class="field-help">Mínimo 8 caracteres.</small>
            </div>
            <div class="form-field">
              <label for="confirmar">
                Confirmar contraseña
                <span class="required-mark" aria-hidden="true">*</span>
              </label>
              <input
                type="password"
                id="confirmar"
                name="confirmar"
                minlength="8"
                autocomplete="new-password"
                required
              >
            </div>
          </div>

          <label class="choice">
            <input type="checkbox" name="terminos" required>
            <span>Acepto los términos y condiciones del servicio.</span>
          </label>

          <div class="form-actions">
            <button type="submit" class="button button-primary">Crear cuenta</button>
            <button type="reset" class="button button-secondary">Limpiar</button>
          </div>
        </form>
      </div>
    </section>
  </main>
</body>
</html>
